<style>
:root{--bg:#fbf6f1;--card:#fffdfb;--tx:#33302e;--mu:#8a817b;--br:#f0e6df;--pr:#e07a6f;--pr2:#fbe4e0;--sg:#8fae9a;--sg2:#e6f0e9;--lv:#a595cf;--lv2:#eee9f8;--rd:#d9645a;--yl:#c98f2a;--yl2:#fbf0d9;--ok:#5d9c7a;--sh:0 8px 28px #b9897a22;--g:linear-gradient(135deg,#f2a094,#e07a6f);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1c1b;--card:#2a2625;--tx:#f3ece7;--mu:#b0a49c;--br:#3a3533;--pr:#f0948a;--pr2:#43302d;--sg:#a3c4af;--sg2:#2c3a32;--lv:#c4b6e6;--lv2:#37324a;--rd:#f08b82;--yl:#e6b95c;--yl2:#43391f;--ok:#8fcfa8;--sh:0 8px 28px #0006;--g:linear-gradient(135deg,#d97a6f,#b95f67)}}
:root[data-theme="dark"]{--bg:#1f1c1b;--card:#2a2625;--tx:#f3ece7;--mu:#b0a49c;--br:#3a3533;--pr:#f0948a;--pr2:#43302d;--sg:#a3c4af;--sg2:#2c3a32;--lv:#c4b6e6;--lv2:#37324a;--rd:#f08b82;--yl:#e6b95c;--yl2:#43391f;--ok:#8fcfa8;--sh:0 8px 28px #0006;--g:linear-gradient(135deg,#d97a6f,#b95f67)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px 2px;max-width:980px;margin:auto}
h1{font-size:17px;margin:0;letter-spacing:.16em;font-weight:800}h1 small{display:block;font-size:11px;font-weight:500;color:var(--mu);letter-spacing:.02em}
main{max-width:980px;margin:auto;padding:4px 16px 130px}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:520px;margin:auto;background:var(--card);border:1px solid var(--br);border-radius:24px;box-shadow:var(--sh);display:flex;padding:6px;z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mu);font-size:10.5px;font-family:inherit;font-weight:600;padding:6px 2px;border-radius:18px;cursor:pointer;transition:all .2s}
nav button b{display:block;font-size:19px;font-weight:400}nav button.on{color:var(--pr);background:var(--pr2)}
.card{background:var(--card);border:1px solid var(--br);border-radius:22px;padding:16px;margin:12px 0;box-shadow:var(--sh);animation:in .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.grid .card{margin:0}
.lb{font-size:12px;color:var(--mu)}.big{font-size:20px;font-weight:700;margin-top:2px}.up{color:var(--ok)}.dn{color:var(--rd)}.wa{color:var(--yl)}.sv{color:var(--lv)}
h2{font-size:17px;margin:22px 0 6px;font-weight:700}h3{font-size:14px;margin:0 0 8px;font-weight:700}.hi{font-size:23px;margin:14px 0 2px;font-weight:800}
.bar{height:10px;background:var(--br);border-radius:10px;overflow:hidden;margin:7px 0}.bar i{display:block;height:100%;background:var(--sg);border-radius:10px;animation:grow .7s ease;transition:width .4s}
.bar.g i{background:var(--g)}.bar.w i{background:var(--yl);animation:pu 1.6s infinite}.bar.o i{background:var(--rd)}.bar.hb{background:#ffffff40}.bar.hb i{background:#fff}
@keyframes grow{from{width:0}}@keyframes pu{50%{opacity:.55}}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--br)}.row:last-child{border:0}
.ico{width:40px;height:40px;border-radius:14px;background:var(--pr2);display:grid;place-items:center;margin-right:10px;flex:none;font-size:19px}
.tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--pr2);color:var(--pr);margin-left:4px;white-space:nowrap}.tag.demo{background:var(--yl2);color:var(--yl)}
button.p,.fab{background:var(--g);color:#fff;border:0;border-radius:16px;padding:11px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer;transition:transform .15s}
button.p:active,.fab:active{transform:scale(.96)}
button.s{background:var(--pr2);color:var(--pr);border:0;border-radius:12px;padding:7px 12px;font:600 13px inherit;font-family:inherit;cursor:pointer}
button.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:12px;font-family:inherit}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;font-size:30px;line-height:1;padding:0;box-shadow:0 8px 20px #e07a6f55;z-index:6}
body:not(.in) nav,body:not(.in) .fab{display:none}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--br);border-radius:14px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0 10px}
label{font-size:12px;color:var(--mu)}
.modal{position:fixed;inset:0;background:#2a1f1c88;display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:in .2s}
.modal>div{background:var(--card);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:26px 26px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.chart{display:flex;align-items:flex-end;gap:5px;height:140px;margin-top:8px}.chart div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10px;color:var(--mu)}
.chart span{display:flex;gap:2px;align-items:flex-end;height:112px;width:100%;justify-content:center}.chart i{width:42%;border-radius:5px 5px 0 0;min-height:2px}
.ins{padding:8px 0;border-bottom:1px solid var(--br)}.sel{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sel select,.sel input{width:auto;flex:1;min-width:110px}
.brand{display:flex;align-items:center;gap:10px}.brand svg{width:36px;height:36px;flex:none;border-radius:10px}
.segs{display:flex;gap:4px;background:var(--pr2);border-radius:16px;padding:4px;margin:10px auto;max-width:380px}.seg{flex:1;border:0;background:none;color:var(--mu);font-size:13px;font-weight:600;font-family:inherit;padding:8px 4px;border-radius:12px;cursor:pointer;transition:all .2s}.seg.on{background:var(--card);color:var(--pr);box-shadow:var(--sh)}.dp{width:auto!important;flex:1;margin:0!important;text-align:center;max-width:190px}
.empty{text-align:center;color:var(--mu);padding:28px 10px}.eico{font-size:42px}.card.empty b{color:var(--tx)}.card.empty p{margin:4px 0 12px}
.hero{background:var(--g);color:#fff;border-radius:26px;padding:20px;margin:12px 0;box-shadow:var(--sh);animation:in .25s ease both}
.hbig{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.2}.hs{font-size:12px;opacity:.88}
.hrow{display:flex;gap:8px;margin:14px 0 10px}.hrow>div{flex:1;background:#ffffff26;border-radius:16px;padding:10px;min-width:0}.hrow span{display:block;font-size:11px;opacity:.88}.hrow b{font-size:13px;word-break:break-word}
.mon{justify-content:center;max-width:320px;margin:6px auto 10px;flex-wrap:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{background:var(--pr2);border-radius:20px;padding:4px 10px;font-size:12px}
.dn-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.donut{width:124px;height:124px;border-radius:50%;flex:none;position:relative}.donut i{position:absolute;inset:27px;background:var(--card);border-radius:50%}

.big2{margin-top:12px;padding:12px;border-radius:16px;background:var(--pr2);font-size:15px}

function goalForm(b){modal("Buat Goal",`<label>Nama</label><input name="name" required><label>Target (Rp)</label><input name="target" inputmode="numeric" data-rp placeholder="Rp 0" required><label>Terkumpul saat ini (Rp)</label><input name="saved" inputmode="numeric" data-rp placeholder="Rp 0"><label>Deadline</label><input type="date" name="deadline"><label>Catatan</label><input name="note"><label><input type="checkbox" name="baby" ${b?"checked":""} style="width:auto"> Baby Fund</label>`,async v=>{const t=parseInt(v.target.replace(/\D/g,""));if(!t)return false;await put("goals",{name:v.name.slice(0,80),target:t,saved:parseInt(v.saved.replace(/\D/g,""))||0,deadline:v.deadline,note:v.note.slice(0,200),baby:!!v.baby})})}
function addSaved(id){const g=S.goals.find(x=>x.id===id);modal("Setor ke "+esc(g.name),`<label>Nominal (Rp)</label><input name="n" inputmode="numeric" data-rp placeholder="Rp 0" required>`,async v=>{const n=parseInt(v.n.replace(/\D/g,""));if(!n)return false;await put("goals",{...g,saved:g.saved+n});toast("✨ Tabungan bertambah!");celebrate()})}
function accForm(){modal("Tambah Rekening",`<label>Nama</label><input name="name" required><label>Jenis</label><select name="kind">${opt(["Cash","Rekening Bank","E-Wallet","Tabungan Bersama","Deposito","Investasi","Emas"])}</select><label>Pemilik</label><select name="owner">${opt(["Suami","Istri","Bersama"])}</select><label>Saldo (Rp)</label><input name="balance" inputmode="numeric" data-rp placeholder="Rp 0" required>`,async v=>{await put("acc",{...v,name:v.name.slice(0,60),balance:parseInt(v.balance.replace(/\D/g,""))||0})})}
function debtForm(){modal("Tambah Hutang",`<label>Nama</label><input name="name" required><label>Jenis</label><select name="kind">${opt(["Cicilan","Paylater","Kartu kredit","Pinjaman","KPR","Kendaraan"])}</select><label>Total hutang awal (Rp)</label><input name="total" inputmode="numeric" data-rp placeholder="Rp 0" required><label>Sisa hutang (Rp)</label><input name="remaining" inputmode="numeric" data-rp placeholder="Rp 0" required><label>Cicilan per bulan (Rp)</label><input name="monthly" inputmode="numeric" data-rp placeholder="Rp 0" required>`,async v=>{const n=k=>parseInt(v[k].replace(/\D/g,""))||0;await put("debt",{name:v.name.slice(0,60),kind:v.kind,total:n("total"),remaining:n("remaining"),monthly:n("monthly")})})}
async function payDebt(id){const d=S.debt.find(x=>x.id===id);if(!confirm("Catat pembayaran cicilan "+rp(d.monthly)+"? Ini juga dicatat sebagai pengeluaran."))return;
 await put("debt",{...d,remaining:Math.max(0,d.remaining-d.monthly)});await put("tx",{type:"expense",date:ymd(new Date()),amount:d.monthly,category:"Cicilan & Kewajiban",subcategory:"Cicilan lainnya",payment_method:"Bank",account:"",recorded_by:by,description:d.name,recurring:"Tidak"})}

function dlFile(name,data,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportCSV(){const h=["id","date","type","amount","category","subcategory","payment_method","account","recorded_by","description","created_at","updated_at"];
 const c="\ufeff"+[h.join(",")].concat(S.tx.map(t=>h.map(k=>'"'+String(t[k]??"").replace(/"/g,'""')+'"').join(","))).join("\n");dlFile("our-money-transaksi.csv",c,"text/csv")}
function backup(){dlFile("our-money-backup-"+ymd(new Date())+".json",JSON.stringify(S,null,1),"application/json")}
async function seed(){if(!confirm("Isi data demo? (ditandai DEMO, bisa dihapus)"))return;const now=ym(new Date());let r=7;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
 for(let i=5;i>=0;i--){const k=addM(now,-i),d=n=>k+"-"+String(n).padStart(2,"0"),T=(type,day,amount,category,subcategory,by,pm)=>put("tx",{type,date:d(day),amount:Math.round(amount/1000)*1000,category,subcategory,payment_method:pm||"Bank",account:"",recorded_by:by,description:"",recurring:"Tidak",demo:true});
  await Promise.all([T("income",25,9500000,"Pemasukan","Gaji Suami","Suami"),T("income",26,7000000,"Pemasukan","Gaji Istri","Istri"),T("expense",1,3500000,"Kebutuhan Rumah","Sewa/Kontrakan","Istri"),T("expense",5,650000,"Kebutuhan Rumah","Listrik","Suami"),T("expense",8,1500000+rnd()*600000,"Makan & Minum","Belanja bulanan","Istri"),T("expense",15,500000+rnd()*400000,"Makan & Minum","Makan di luar","Suami"),T("expense",10,700000+rnd()*400000,"Transportasi","Bensin","Suami"),T("expense",12,400000+rnd()*400000,"Pribadi Suami","Hobi","Suami"),T("expense",14,400000+rnd()*400000,"Pribadi Istri","Skincare","Istri"),T("expense",20,300000+rnd()*700000,"Hiburan & Lifestyle","Streaming","Istri"),T("expense",18,300000+rnd()*200000,"Anak / Persiapan Anak","Vitamin/suplemen","Istri"),T("expense",3,1200000,"Cicilan & Kewajiban","Kendaraan","Suami"),T("saving",27,2000000,"Tabungan & Investasi","Dana darurat","Suami"),T("saving",27,1000000,"Tabungan & Investasi","Tabungan persalinan","Istri")])}
 await Promise.all([put("goals",{name:"Dana Darurat",target:30000000,saved:12500000,note:"6x pengeluaran bulanan",demo:true}),put("goals",{name:"Dana Persalinan",target:20000000,saved:5000000,baby:true,demo:true}),put("goals",{name:"Tabungan Anak",target:50000000,saved:8000000,baby:true,demo:true}),
 put("budget",{category:"Makan & Minum",limit:2500000,demo:true}),put("budget",{category:"Transportasi",limit:1000000,demo:true}),put("budget",{category:"Hiburan & Lifestyle",limit:500000,demo:true}),
 put("acc",{name:"BCA Suami",kind:"Rekening Bank",owner:"Suami",balance:8500000,demo:true}),put("acc",{name:"Tabungan Bersama",kind:"Tabungan Bersama",owner:"Bersama",balance:18000000,demo:true}),put("debt",{name:"Cicilan Motor",kind:"Kendaraan",total:24000000,remaining:14400000,monthly:1200000,demo:true})])}
async function clearDemo(){if(!confirm("Hapus semua data demo? Data asli tidak terhapus."))return;await Promise.all(Object.keys(S).flatMap(c=>S[c].filter(x=>x.demo).map(x=>del(c,x.id))))}

async function refresh(first){try{const r=await gs("getAll");if(!first&&JSON.stringify(r.data)===JSON.stringify(S))return;S=r.data;if(first){by=LS.get("om_by")||r.me;savePW()}db=true;document.body.classList.add("in");render()}catch(e){const m=String(e.message||e);if(/Password|percobaan/.test(m)){LS.set("om_pw","");SS.set("om_pw","");PW="";loginUI(m)}else if(first||!db)$("#app").innerHTML='<div class="empty">Gagal memuat: '+esc(m)+'<br><br><button class="s" onclick="location.reload()">Coba lagi</button></div>'}}
render();if(PW)refresh(true);else loginUI("");
setInterval(()=>{if(!document.hidden&&!Q.length&&!document.querySelector(".modal"))refresh()},30000);
